# XcodeGen spec. Generates PassVault.xcodeproj so there is no giant project file to keep
# in the repo and merge by hand.
#
#   brew install xcodegen
#   cd ios/App && xcodegen
#   open PassVault.xcodeproj

name: PassVault
options:
  bundleIdPrefix: com.passvault
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  PassVaultKit:
    path: ../PassVaultKit

targets:
  PassVault:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PassVaultKit
        product: PassVaultKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PassVault
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Shown in the Face ID prompt. iOS refuses to use Face ID at all without it.
        NSFaceIDUsageDescription: PassVault uses Face ID to unlock your credentials.
        # Keeps the vault file out of iTunes/Finder sharing and the Files app.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passvault.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # Keeping the vault out of iCloud and iTunes backups is done in code, in
        # PhoneVault.init - see isExcludedFromBackup there.
